name: CI

# Postyar CI pipeline — build verification + security gate.
# DEPLOYMENT IS MANUAL (shared-host scripts/deploy.sh); nothing here deploys.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  api-typecheck:
    name: API — install + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

  frontend-typecheck-build:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (tsc --noEmit && vite build)
        run: bun run build
      - name: Upload SPA dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  unit-tests:
    name: Unit tests (vitest, DB-free)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bunx vitest run

  security:
    name: Security gate (secret scan + release markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (tracked dirs, excluding node_modules/dist)
        run: |
          set -euo pipefail
          # Mirrors scripts/release-check.sh — keep both in sync.
          MATCHES=$(grep -rIEn "(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|xox[bp]-[A-Za-z0-9-]{10,})" \
            app/src frontend/src database wordpress-plugin scripts docs assets 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "SECRET SCAN FAILED:"; echo "$MATCHES"; exit 1
          fi
      - name: Explicit release blockers (TODO: RELEASE / FIXME: RELEASE / XXX: RELEASE)
        run: |
          set -euo pipefail
          MATCHES=$(grep -rn --exclude="release-check.sh" "TODO: RELEASE\|FIXME: RELEASE\|XXX: RELEASE" \
            app/src frontend/src wordpress-plugin database scripts docs 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "RELEASE MARKERS FOUND:"; echo "$MATCHES"; exit 1
          fi
      - name: Next.js must not appear in product source
        run: |
          set -euo pipefail
          MATCHES=$(grep -rEi "from ['\"]next(/|['\"]| )|(nextjs|next\.js)" \
            app/src frontend/src wordpress-plugin 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "FORBIDDEN FRAMEWORK REFERENCES:"; echo "$MATCHES"; exit 1
          fi

  plugin-php-lint:
    name: WP plugin — PHP syntax (php -l)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP with tokenizer extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: tokenizer, json, mbstring
      - name: Lint all plugin PHP files
        run: |
          set -euo pipefail
          STATUS=0
          while IFS= read -r -d '' f; do
            echo "php -l $f"
            php -l "$f" || STATUS=1
          done < <(find wordpress-plugin -type f -name '*.php' -print0)
          # Gate fails if the connector ships syntax errors; an empty plugin dir
          # (no *.php yet) is reported by scripts/release-check.sh instead.
          exit $STATUS
